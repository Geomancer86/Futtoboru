  - id: club_insolvency_correction
    name: AI club bankruptcy / wage-cut correction
    status: none
    release_min: R-1892
    plain: >
      AI-controlled clubs can drift into unrecovered debt over many seasons because
      there is no bankruptcy or automatic wage-cut mechanic yet (EconomyHealthMonitor
      only monitors and warns). Found 2026-07-15 by extending cup soak coverage from
      2 to 15 seasons; not a R-1888 regression (only 3-season non-negative balances
      were ever an R-1888 commitment). Tracked as A-9 in release history; see
      RELEASE_V1_DEFINITION.md TR-2 and section 9.1.

  - id: pregame_menus_polish
    name: Pre-game menu screens (main menu, settings, new game wizard, manager creation, save/load)
    status: partial
    release_min: R-1888
    plain: >
      Full audit 2026-07-19 of every screen between launch and Start Game found several
      P0-severity gaps: New Game Start allows a null manager through; Create Manager
      silently swallows an invalid birth date into null with no feedback and still
      saves; manager creation silently overwrites an existing file with the same last
      name; the Countries step allows proceeding with zero countries selected; Start
      Game failures are completely silent to the player (console/log only); Quit (main
      menu and in-game) has no confirmation; in-game "Quit to Menu"/"Quit to Desktop"
      are both no-ops. Also found P1/P2 issues: most of the Settings screen's
      graphics/sound panels are dead DarkBlade-game leftovers (no audio system exists
      anywhere in the codebase); the language dropdown doesn't persist; Load Game shows
      no save metadata and no delete option and fails silently on a corrupted save; no
      step-of-3 indicator in the New Game wizard; scattered unlocalized strings.
      Full per-screen breakdown, code citations, and proposed redesign for each screen:
      docs/planning/ANALYSIS_PREGAME_MENUS_UX_AUDIT_V1.md. PO decision 2026-07-19:
      proceed on everything except the Settings screen (deferred separately); turned
      into a per-screen acceptance-criteria/task spec at
      docs/specs/pregame_menus_polish/spec.md (7 independently-orderable units: Main
      Menu, New Game x3 steps, Create Manager, Load/Save + in-game Quit stubs).
      All 7 units implemented 2026-07-19 in one pass: shared ConfirmDialog/ErrorDialog/
      WizardStepLabel widgets; Main Menu Continue + Quit-confirm + branding; New Game
      wizard null-guards, manager UX, country validation+counter, filtered
      cups/leagues counts, busy indicator and error dialog on Start failure; Create
      Manager birth-date validation (rejects calendar-invalid/implausible dates,
      no more silent-null corruption), overwrite confirm, direct in-memory ownership
      wiring, Back button; Load/Save dialogs now show real save metadata, support
      delete and overwrite-confirm, sort most-recent-first, and show error dialogs on
      corrupt-load instead of failing silently; in-game "Quit to Menu"/"Quit to Desktop"
      now functional behind ConfirmDialog. ~60 new i18n keys added to all 3 language
      bundles. Full default suite (165 tests) + nightly profile green. Status remains
      `partial` only because the Settings screen (explicitly deferred by PO) is still
      untouched — see analysis doc §2 for that follow-up.
