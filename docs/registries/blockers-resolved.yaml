    title: Home/Overview screen was a "HOME screen placeholder" button since the beginning of the project
    note: >
      Human request, same session: "we have a home screen placeholder since the beginning of eras,
      what can we show there? analyze football manager and championship manager games". Replaced
      `HomeScreenTable` (previously a single hardcoded `VisTextButton("HOME screen placeholder")`,
