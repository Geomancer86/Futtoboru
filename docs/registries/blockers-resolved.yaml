  - id: A-10
    resolved: "2026-07-19"
    title: Desktop jar crashed on startup for every human tester (build-and-run.bat)
    note: >
      Reported by the user running build-and-run.bat: the packaged desktop jar crashed
      immediately on launch with GdxRuntimeException / MissingResourceException "Can't
      find bundle for base file handle mods/language/BaseBundle, locale en_US", before
      the main menu ever rendered. Root cause: the language bundle files on disk were
      named with lowercase country codes (BaseBundle_en_us.properties, _en_uk, _sp_la,
      _sp_sp) but com.badlogic.gdx.utils.I18NBundle requests them by Locale-derived,
      uppercase-country filenames (BaseBundle_en_US.properties, etc); zip/jar resource
      lookups are always case-sensitive regardless of host OS, so this was a hard crash
      in the packaged jar even though it worked from an IDE/loose-classpath run on
      case-insensitive filesystems (Windows/NTFS) -- which is exactly why 165 green
      `mvn test` tests, including several that boot a headless Futtoboru instance and
      exercise the same asset-loading code, never caught it. Confirmed pre-existing (not
      a regression from the same-day menu-polish commit) by rebuilding and running the
      prior commit (8406e0d) in an isolated git worktree, which crashed identically.
      Fix: renamed the four bundle files to the exact case I18NBundle expects (git mv,
      history preserved); verified by rebuilding, listing the packaged jar's zip entries,
      and actually launching the produced jar-with-dependencies (stayed up, no crash,
      confirmed via game_verify.log). Added a permanent regression test,
      LanguageBundleFileNamingTest, that does a case-sensitive `File.list()` comparison
      (deliberately bypassing Gdx.files so it fails the same way on any OS) against every
      Language known to LanguageModLoader. L1+L2 now 166 tests (was 165), all green.
      AGENTS.md updated with a "packaged-jar smoke check" note: after touching packaged
      resources, actually run build.bat and launch the produced jar, not just `mvn test`.

  - id: A-11
    resolved: "2026-07-19"
    title: New Game -> Start Game reached MainGameScreen with ~36 raw/untranslated UI labels
    note: >
      Follow-up report from the same user, same session, right after A-10 was fixed: "the game
      fails and you cannot start it, from the new game option". The desktop jar itself no longer
      crashed on boot (A-10 was real), but MainGameScreen and its tabs (Squad, Authority, Personal
      Details, Schedule, Finances, Club Info, Competitions, Match History, Inbox, Home, day-of-week
      headers on the fixtures table, etc.) render dozens of labels via
      LanguageModLoader.getValue("some_key") whose key was never added to *any* language bundle --
      LanguageModLoader.getValue() deliberately never throws on a missing key (by design, so one
      bad key doesn't crash the whole UI), it just logs "missing bundle key: X" and falls back to
      showing the raw key string itself. To a human tester clicking through a real New Game, a
      screen full of "home / squad / authority / nationality / current_club / MONDAY" instead of
      real words reads exactly like "the game fails and you cannot start it", even though nothing
      technically threw. Zero automated test exercises MainGameScreen or its tabs (out of scope for
      R-1888 per AGENTS.md's stance on real Scene2D/VisUI screen construction in tests), so nothing
      caught this either.
      Root-caused by adding two small, off-by-default, system-property-gated debug hooks to the
      *production* code (Futtoboru.changeScreen / a new runFullNewGameFlowForTesting(), plus a
      NewGameOverviewScreen.triggerStartGameForTesting()/selectProfessionAndClubForTesting() test
      entry point) that drive the exact real production code path -- season select -> manager
      create -> country select -> profession/club select -> Start Game -- from the command line
      (`-Dfuttoboru.debug.startScreen=NEW_GAME_FULL_FLOW -Dfuttoboru.debug.exitAfterStartScreen=true`,
      optionally `-Dfuttoboru.debug.professionId=` / `-Dfuttoboru.debug.clubId=` to force a specific
      profession/club), then actually running the packaged jar with them and reading the console.
      Reproduced on both the no-club (Retired Player) and club-required (Manager + a real club) paths.
      Found 36 missing keys via a static-analysis diff (every literal
      `LanguageModLoader.getValue("...")` call in the codebase vs. every key defined in
      BaseBundle_en_US.properties) -- same technique then reused to discover en_UK/sp_LA/sp_SP were
      missing even more (up to 111 for sp_SP, which was missing its entire "Layer B" tactics section
      and the whole pre-game-menus section from two earlier work sessions). Fixed all four bundles so
      every literal getValue() key used anywhere in the codebase now resolves in every bundle (Spanish
      translations added for sp_LA/sp_SP, not just copy-pasted English). Added a permanent regression
      test, LanguageBundleKeyCoverageTest, that statically scans every .java file for literal
      getValue(...) calls and asserts the key exists in every shipped bundle -- fully headless, no UI
      construction needed, so it runs in the normal fast default suite. Re-ran both full-flow debug
      paths after the fix: zero "missing bundle key" lines, reaches MainGameScreen cleanly. L1+L2 now
      167 tests (was 166), all green. The two debug hooks are harmless in normal play (off unless the
      system property is set) and are now a reusable tool for the next time someone needs to check the
      New Game flow without clicking through it by hand.

  - id: A-12
    resolved: "2026-07-19"
    title: New Game Step 2 (Choose Countries) crashed immediately on screen construction
    note: >
      A human tester clicked through the real game right after A-10/A-11 shipped and hit a third,
      different crash on the exact same real click path: NewGameSeasonScreen -> Start ->
      NewGameSetupScreen threw GdxRuntimeException "No TooltipStyle registered with name: Select at
      least one country to continue" the instant the screen was constructed -- before any click on
      that screen was even possible. This was missed by the NEW_GAME_FULL_FLOW debug hook added for
      A-11 because that hook's first version jumped straight from Step 1 to
      NewGameOverviewScreen (Step 3), skipping NewGameSetupScreen (Step 2) entirely -- the exact
      opposite of what the real Start button does. Root cause #1:
      `new Tooltip(LanguageModLoader.getValue("choose_countries_none_selected_tooltip"))` -- VisUI's
      `Tooltip(String)` constructor is NOT a text constructor, it looks up a *named TooltipStyle* in
      the skin and throws if nothing is registered under that literal string; the correct API for a
      plain-text tooltip is `new Tooltip.Builder(text).target(actor).build()`. Fixed that, rebuilt,
      re-ran the debug hook (now correctly routed through Step 2) and hit root cause #2 immediately:
      `IllegalStateException: More than one tooltip cannot be added to the same target!` --
      `Tooltip.Builder.target(actor)` already attaches during `.build()`, so the pre-existing explicit
      `.attach()` call right after (copied from the old, wrong `Tooltip(String)` + `setTarget()` +
      `attach()` pattern) double-attached to the same button. Fixed by dropping the redundant
      `.attach()` call. Fixed `Futtoboru.runFullNewGameFlowForTesting()` (the A-11 debug hook) and
      added `NewGameSetupScreen.triggerNextForTesting()` so the scripted flow now genuinely goes
      Step 1 -> Step 2 (construct + Next click) -> Step 3 -> Start Game, matching the real button
      chain exactly instead of skipping a step. Re-verified both the no-club and club-required
      profession paths end to end after the fix: zero exceptions, reaches MainGameScreen cleanly.
      No test count change (no new automated test added this round; the debug hook itself is the
      verification tool, run manually against the real packaged jar) -- L1+L2 still 167 + 5, all green.

  - id: A-13
    resolved: "2026-07-19"
    title: Cup draw soft-locked Continue forever; cup competitions could never progress past Round 1
    note: >
      Human report, same session: "we got a message telling what team we play against... but the
      continue button is stuck on draw but it does not move to the draw screen. The same bug
      happened with the league draw but we were able to move forward. We were not able to finish a
      complete season." Investigated by writing a new headless regression test
      (CupDrawUiFlowIT) that drives raw continueOneDay() (no test-only shortcuts) until a real cup
      draw fires, then replicates MainGameMenuTable's "INBOX -> DRAW" click handler and
      MainMenuManager's CUP_DRAW_SCREEN case statement-for-statement to find exactly where the real
      UI flow breaks down -- found THREE independent real bugs stacked on top of each other:
      (1) HeadlessGdxTestSupport (shared by every headless integration test, including all
      multi-season soak ITs) manually built its own scriptsManager/authorityManager/gameEngine
      triple and wired it into the `Futtoboru` app object, then ALSO called
      `new HeadlessApplication(application, config)`, which runs the real LibGDX lifecycle and
      calls `Futtoboru.create()` -- which unconditionally built and wired in a *second*, completely
      independent triple, silently orphaning the first. Every test kept driving continueGame()/match
      simulation through the orphaned (first) engine, while AuthorityManager/ScriptsManager
      internally re-fetch "the current" engine dynamically via `game.getGameEngine()` and got the
      second (create()'s) one -- so match-result messages and cup/league-draw messages were
      delivered through two independent `MessageManager` instances, each with its own
      `nextMessageId` counter, both writing into the *same* `SaveGame.allMessages`/
      `scheduledMessages` lists. Once a match-result message (counter A) happened to reuse the exact
      same numeric id as a freshly-scheduled mandatory CUP_DRAW message (counter B),
      `MessageManager.deliverMessage()`'s id-based dedup check treated the brand-new CUP_DRAW
      message as "already delivered" (matching the unrelated match-result message's id) and
      silently dropped it forever -- it never reached the inbox, so `MainMenuManager`'s
      CUP_DRAW_SCREEN case could never find it, logged "Could not find competition edition for cup
      draw", and silently fell back to the inbox screen: exactly the "stuck, does not move to the
      draw screen" symptom. Fixed by adding null-guards around the scriptsManager/authorityManager/
      gameEngine construction in `Futtoboru.create()` so a caller that has already wired up this
      exact triple (as the test harness does) is reused instead of silently duplicated -- normal
      desktop play is unaffected (create() only ever runs once there, so the guarded fields are
      always null at that point). NOTE: because `Futtoboru.create()` really is only ever called once
      in the shipped desktop app, this specific *mechanism* was a test-harness-only artifact, not
      reachable in real play -- but it was actively corrupting the trustworthiness of every existing
      engine-level integration test that touches mandatory messages (dedup silently drops messages
      with zero error logged, so nothing was failing loudly), which is exactly why "the testing is
      not good" felt true even though the fast default suite was all green.
      (2) `MessageManager.createCupDrawResultMessage()` (the "your club has been drawn against X"
      spoiler, unrelated to the mandatory gate above) gave every Round 1 tie's message the *exact
      same* title ("<Cup> First Round") regardless of which two clubs were involved --
      `deliverMessage()`'s separate type+title dedup check silently dropped every tie's result
      message except the very first one delivered, so most participating clubs' "you play against
      X" message never reached any inbox at all, independent of bug (1) and reproducible in real
      production. Fixed by including the club name in the title so each tie's message is unique.
      (3) `AuthorityManager.competitionScheduler` (the field `checkCupRoundProgression()` uses to
      draw Round 2+ once Round 1 finishes) was declared but **never assigned** anywhere in the
      codebase -- a genuine, real, always-present production bug found only once bug (1) stopped
      masking it (by delaying/varying exactly when Round 1 completion was reached in these tests):
      every attempt to progress a cup past Round 1 threw a `NullPointerException`, caught and only
      logged as a "CRITICAL ERROR" (so the game never visibly crashed), meaning **no cup competition
      could ever complete a full bracket** in the shipped game either -- directly explaining "we were
      not able to finish a complete season" independent of the Continue-button soft-lock. Fixed by
      constructing `this.competitionScheduler = new CompetitionScheduler(parent)` in
      `AuthorityManager`'s constructor, mirroring the existing `fixtureGenerator` field one line
      above it. Verified all three fixes together: `CupDrawUiFlowIT` (new, added this round) passes
      end to end (message delivered, edition resolved, fixtures found, gate clears, Continue
      advances again); re-ran `MultiSeasonLeagueAndCupSoakIT` (15 procedural seasons) manually and
      got 15/15 league champions **and** 15/15 FA Cup champions with zero health issues, ~1s/season
      -- cup competitions now genuinely complete every season, not just the league. L1+L2 167 + 5 ->
      **168 + 5**, all green.

  - id: A-14
