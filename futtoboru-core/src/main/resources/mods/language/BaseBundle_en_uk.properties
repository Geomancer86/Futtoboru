# ERA EVENTS (H-06, gamedata/core/era/events.json)
era.press-1874-widdowson-shin-pads.title=A novelty from Forest
era.press-1874-widdowson-shin-pads.body=Mr S. W. Widdowson of Nottingham Forest has taken the field with a pair of cut-down cricket pads strapped outside his stockings. The spectators were much amused.
era.ifab-1889-ball-weight.title=The Board fixes the weight of the ball
era.ifab-1889-ball-weight.body=At its annual meeting the International Football Association Board resolved that the ball shall weigh from 13 to 15 ounces at the start of the game. The circumference remains 27 to 28 inches.
era.ifab-1889-referee-free-kick.title=The referee may act without appeal
era.ifab-1889-referee-free-kick.body=The Board has resolved that the referee may award a free kick for dangerous play without waiting for an appeal, may stop the game for darkness, and may send a player off for repeated misconduct.
era.ifab-1890-no-goal-from-goal-kick.title=No goal direct from a goal kick
era.ifab-1890-no-goal-from-goal-kick.body=A goal may no longer be scored directly from a goal kick. The ball must be touched by another player first.
era.ifab-1891-penalty-kick.title=New law: the penalty kick
era.ifab-1891-penalty-kick.body=From next season, wilful tripping, holding or handling by a defender within twelve yards of his own goal line shall be punished by a penalty kick, taken from the twelve-yard line with only the goalkeeper to beat.
era.ifab-1891-referee-linesmen.title=The referee takes the field
era.ifab-1891-referee-linesmen.body=The Board has resolved that the referee shall control the game from the field of play and decide all disputed points without waiting for an appeal. The two umpires are replaced by linesmen, who shall signal when the ball is out of play.
era.league-1891-goal-nets.title=Nets to be fitted to the goals
era.league-1891-goal-nets.body=League clubs are to fit Mr Brodie goal nets this season, so that there may be no more dispute whether the ball passed between the posts.
era.league-1891-fourteen-clubs.title=The League grows to fourteen clubs
era.league-1891-fourteen-clubs.body=The Football League will play with fourteen clubs next season. Stoke return and Darwen are elected.
era.ifab-1892-keeper-charge.title=The goalkeeper may not be charged at will
era.ifab-1892-keeper-charge.body=A goalkeeper may be charged only when he is playing the ball or obstructing an opponent. Bundling him over the line is no longer fair play.
era.league-1892-second-division.title=A Second Division is formed
era.league-1892-second-division.body=The Football League absorbs the Football Alliance and forms a Second Division. Promotion and relegation will be settled by test matches between the clubs concerned.
era.ifab-1893-referee-decision-final.title=The referee has the last word
era.ifab-1893-referee-decision-final.body=The decision of the referee on any point of play is final. Appeals to the officials are at an end.
era.league-1893-retain-and-transfer.title=Players to be registered and retained
era.league-1893-retain-and-transfer.body=Clubs must register their players each year with the Association. A registered player may not join another League club without the consent of his own club, even when his agreement has ended.
era.ifab-1898-added-time.title=The referee may add time lost
era.ifab-1898-added-time.body=The referee shall add to each half the time lost through accident or delay. He shall also inspect the boots of the players before the match.
era.league-1898-automatic-promotion.title=Test matches are abolished
era.league-1898-automatic-promotion.body=After the Stoke and Burnley draw that suited both, the League has abolished test matches. The bottom two clubs of each division now change places automatically, and both divisions will have eighteen clubs.
era.press-1900-shin-pads-common.title=Shin pads are now common
era.press-1900-shin-pads-common.body=Smaller shin pads, worn inside the stockings, are now seen on most players in the League, though no law requires them.
era.ifab-1901-keeper-handling-any.title=The goalkeeper may handle for any purpose
era.ifab-1901-keeper-handling-any.body=The goalkeeper may now use his hands for any purpose within his own half, not only to protect his goal.
era.league-1901-maximum-wage.title=League sets a maximum wage
era.league-1901-maximum-wage.body=The Football League has resolved that no club shall pay a player more than four pounds a week. Existing agreements above this sum must be revised.
era.ifab-1903-direct-free-kicks.title=Direct free kicks and the advantage rule
era.ifab-1903-direct-free-kicks.body=A goal may be scored directly from a free kick given for handling or foul play. The referee may let play go on when stopping it would favour the offender.
era.fa-1904-knees-uncovered.title=Knees may now be bare
era.fa-1904-knees-uncovered.body=The Association has dropped the rule that knickerbockers must cover the knee. Shorts are expected to grow shorter.
era.press-1905-alf-common-fee.title=A thousand pounds for one player
era.press-1905-alf-common-fee.body=Sunderland have sold Alf Common to Middlesbrough for one thousand pounds, the first fee of that size. The newspapers wonder where it will end.
era.league-1905-twenty-clubs.title=Both divisions to twenty clubs
era.league-1905-twenty-clubs.body=The Football League will play with twenty clubs in each division from next season.
era.ifab-1907-offside-own-half.title=No offside in own half
era.ifab-1907-offside-own-half.body=A player cannot be offside in the half of the field he defends.
era.league-1908-transfer-fee-cap.title=A limit on transfer fees
era.league-1908-transfer-fee-cap.body=The Football League has fixed three hundred and fifty pounds as the most a club may pay in a transfer fee.
era.league-1909-transfer-fee-cap-withdrawn.title=The transfer limit is withdrawn
era.league-1909-transfer-fee-cap-withdrawn.body=After a year of evasions, the Football League has withdrawn its limit on transfer fees.
era.ifab-1909-keeper-colour.title=Goalkeepers to wear a different colour
era.ifab-1909-keeper-colour.body=The goalkeeper must wear a jersey of scarlet or royal blue, so that the referee and the players can tell him from the rest of his side.
era.press-1909-wet-ball-report.title=A heavy ball on a wet day
era.press-1909-wet-ball-report.body=A newspaper reports that a leather ball picked up almost half its own weight in water over ninety minutes of play.
era.league-1910-maximum-wage-five.title=The maximum wage rises to five pounds
era.league-1910-maximum-wage-five.body=The Football League has raised the maximum wage to five pounds a week, with bonuses allowed on top.
era.ifab-1912-keeper-penalty-area.title=The goalkeeper handles only in the penalty area
era.ifab-1912-keeper-penalty-area.body=The goalkeeper may handle the ball only within his own penalty area. Outside it he is a player like any other.
era.league-1915-war-suspension.title=League football is suspended
era.league-1915-war-suspension.body=Because of the war, the Football League will play no more matches until peace returns.
era.league-1919-resumption.title=The League resumes with twenty-two clubs
era.league-1919-resumption.body=League football returns after the war, with twenty-two clubs in each division.
era.ifab-1920-no-offside-throw-in.title=No offside from a throw-in
era.ifab-1920-no-offside-throw-in.body=A player cannot be offside direct from a throw-in.
era.league-1920-third-division.title=A Third Division is formed
era.league-1920-third-division.body=The Southern League clubs join the Football League as a Third Division.
era.league-1920-maximum-wage-nine.title=The maximum wage rises to nine pounds
era.league-1920-maximum-wage-nine.body=The Football League has raised the maximum wage to nine pounds a week.
era.league-1922-maximum-wage-eight.title=The maximum wage is cut to eight pounds
era.league-1922-maximum-wage-eight.body=The Football League has cut the maximum wage to eight pounds a week in the season. In the summer the limit is six pounds.
era.ifab-1924-goal-from-corner.title=A goal may be scored from a corner
era.ifab-1924-goal-from-corner.body=A goal may be scored direct from a corner kick.
era.ifab-1925-offside-two.title=The offside law is changed
era.ifab-1925-offside-two.body=A player will now be on side if two opponents, instead of three, are nearer their own goal line when the ball is played.
era.press-1925-dassler-studs.title=Boots with studs that can be replaced
era.press-1925-dassler-studs.body=The Dassler brothers are making boots with six or seven nailed-in studs that can be replaced when worn.
era.ifab-1931-keeper-four-steps.title=The goalkeeper may take four steps
era.ifab-1931-keeper-four-steps.body=The goalkeeper may take four steps while carrying the ball before he must release it.
era.press-1931-laceless-ball.title=A ball without laces
era.press-1931-laceless-ball.body=A laceless ball with a valve has been patented in Argentina. English clubs show no interest yet.
era.ifab-1937-ball-weight.title=A heavier ball is allowed
era.ifab-1937-ball-weight.body=The Board has resolved that the ball shall weigh from 14 to 16 ounces at the start of the game. Boot stud specifications are dropped from the laws.
era.ifab-1938-laws-rewritten.title=The Laws are rewritten
era.ifab-1938-laws-rewritten.body=Mr Stanley Rous has rewritten the Laws of the Game into seventeen laws, with clearer wording and no change of substance.
era.league-1939-numbered-shirts.title=Numbered shirts become compulsory
era.league-1939-numbered-shirts.body=Every League club must now number the shirts of its players, so that the crowd may know who is who.
