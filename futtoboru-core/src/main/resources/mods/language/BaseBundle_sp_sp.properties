# ERA EVENTS (H-06, gamedata/core/era/events.json)
era.press-1874-widdowson-shin-pads.title=La novedad de un jugador del Forest
era.press-1874-widdowson-shin-pads.body=El se\u00f1or S. W. Widdowson, del Nottingham Forest, ha saltado al campo con unas rodilleras de cricket recortadas atadas por fuera de las medias. El p\u00fablico se ha divertido mucho.
era.ifab-1889-ball-weight.title=La Junta fija el peso del bal\u00f3n
era.ifab-1889-ball-weight.body=En su reuni\u00f3n anual la International Football Association Board ha resuelto que el bal\u00f3n pese entre 13 y 15 onzas al comenzar el juego. La circunferencia sigue siendo de 27 a 28 pulgadas.
era.ifab-1889-referee-free-kick.title=El \u00e1rbitro puede actuar sin apelaci\u00f3n
era.ifab-1889-referee-free-kick.body=La Junta ha resuelto que el \u00e1rbitro pueda conceder un tiro libre por juego peligroso sin esperar una apelaci\u00f3n, suspender el juego por falta de luz y expulsar a un jugador por mala conducta reiterada.
era.ifab-1890-no-goal-from-goal-kick.title=Sin gol directo de saque de puerta
era.ifab-1890-no-goal-from-goal-kick.body=Ya no podr\u00e1 marcarse un gol directamente de un saque de puerta. Otro jugador debe tocar antes el bal\u00f3n.
era.ifab-1891-penalty-kick.title=Nueva ley: el penalti
era.ifab-1891-penalty-kick.body=Desde la pr\u00f3xima temporada, la zancadilla, el agarr\u00f3n o la mano deliberada de un defensor a menos de doce yardas de su l\u00ednea de meta se castigar\u00e1n con un penalti, lanzado desde la l\u00ednea de las doce yardas con solo el portero por delante.
era.ifab-1891-referee-linesmen.title=El \u00e1rbitro entra al campo
era.ifab-1891-referee-linesmen.body=La Junta ha resuelto que el \u00e1rbitro dirija el juego desde el terreno y decida todas las disputas sin esperar una apelaci\u00f3n. Los dos jueces son sustituidos por jueces de l\u00ednea, que indicar\u00e1n cu\u00e1ndo el bal\u00f3n sale del campo.
era.league-1891-goal-nets.title=Redes en las porter\u00edas
era.league-1891-goal-nets.body=Los clubes de la Liga deben instalar las redes de porter\u00eda del se\u00f1or Brodie esta temporada, para que no haya m\u00e1s disputas sobre si el bal\u00f3n pas\u00f3 entre los postes.
era.league-1891-fourteen-clubs.title=La Liga crece a catorce clubes
era.league-1891-fourteen-clubs.body=La Football League jugar\u00e1 con catorce clubes la pr\u00f3xima temporada. Vuelve el Stoke y es elegido el Darwen.
era.ifab-1892-keeper-charge.title=El portero ya no puede ser cargado a voluntad
era.ifab-1892-keeper-charge.body=Solo se podr\u00e1 cargar al portero cuando juegue el bal\u00f3n u obstruya a un contrario. Empujarlo con el bal\u00f3n hasta la l\u00ednea ya no es juego limpio.
era.league-1892-second-division.title=Se crea una Segunda Divisi\u00f3n
era.league-1892-second-division.body=La Football League absorbe a la Football Alliance y forma una Segunda Divisi\u00f3n. El ascenso y el descenso se decidir\u00e1n en partidos de promoci\u00f3n entre los clubes afectados.
era.ifab-1893-referee-decision-final.title=La decisi\u00f3n del \u00e1rbitro es definitiva
era.ifab-1893-referee-decision-final.body=La decisi\u00f3n del \u00e1rbitro sobre cualquier punto del juego es definitiva. Se acaban las apelaciones a los oficiales.
era.league-1893-retain-and-transfer.title=Jugadores registrados y retenidos
era.league-1893-retain-and-transfer.body=Los clubes deben registrar cada a\u00f1o a sus jugadores en la Asociaci\u00f3n. Un jugador registrado no podr\u00e1 fichar por otro club de la Liga sin el permiso de su club, aunque su contrato haya terminado.
era.ifab-1898-added-time.title=El \u00e1rbitro podr\u00e1 a\u00f1adir el tiempo perdido
era.ifab-1898-added-time.body=El \u00e1rbitro a\u00f1adir\u00e1 a cada parte el tiempo perdido por accidentes o demoras. Tambi\u00e9n revisar\u00e1 las botas de los jugadores antes del partido.
era.league-1898-automatic-promotion.title=Se abolen los partidos de promoci\u00f3n
era.league-1898-automatic-promotion.body=Tras el empate de Stoke y Burnley que convino a ambos, la Liga ha abolido los partidos de promoci\u00f3n. Los dos \u00faltimos de cada divisi\u00f3n cambiar\u00e1n de categor\u00eda autom\u00e1ticamente, y ambas divisiones tendr\u00e1n dieciocho clubes.
era.press-1900-shin-pads-common.title=Las espinilleras se generalizan
era.press-1900-shin-pads-common.body=Las espinilleras, m\u00e1s peque\u00f1as y llevadas bajo las medias, se ven ya en la mayor\u00eda de los jugadores de la Liga, aunque ninguna ley las exige.
era.ifab-1901-keeper-handling-any.title=El portero podr\u00e1 usar las manos con cualquier fin
era.ifab-1901-keeper-handling-any.body=El portero podr\u00e1 usar las manos con cualquier fin en su propia mitad, no solo para proteger su porter\u00eda.
era.league-1901-maximum-wage.title=La Liga fija un salario m\u00e1ximo
era.league-1901-maximum-wage.body=La Football League ha resuelto que ning\u00fan club pague a un jugador m\u00e1s de cuatro libras a la semana. Los contratos que superen esa suma deber\u00e1n revisarse.
era.ifab-1903-direct-free-kicks.title=Tiros libres directos y la ley de la ventaja
era.ifab-1903-direct-free-kicks.body=Podr\u00e1 marcarse gol directamente de un tiro libre concedido por mano o juego sucio. El \u00e1rbitro podr\u00e1 dejar seguir el juego cuando detenerlo favorezca al infractor.
era.fa-1904-knees-uncovered.title=Las rodillas pueden quedar al aire
era.fa-1904-knees-uncovered.body=La Asociaci\u00f3n ha eliminado la norma que obligaba a cubrir la rodilla con los pantalones. Se espera que los pantalones se acorten.
era.press-1905-alf-common-fee.title=Mil libras por un solo jugador
era.press-1905-alf-common-fee.body=El Sunderland ha vendido a Alf Common al Middlesbrough por mil libras, el primer traspaso de esa cuant\u00eda. Los peri\u00f3dicos se preguntan hasta d\u00f3nde llegar\u00e1 esto.
era.league-1905-twenty-clubs.title=Ambas divisiones pasan a veinte clubes
era.league-1905-twenty-clubs.body=La Football League jugar\u00e1 con veinte clubes en cada divisi\u00f3n desde la pr\u00f3xima temporada.
era.ifab-1907-offside-own-half.title=Sin fuera de juego en la propia mitad
era.ifab-1907-offside-own-half.body=Un jugador no puede estar en fuera de juego en su propia mitad del campo.
era.league-1908-transfer-fee-cap.title=Un l\u00edmite a los traspasos
era.league-1908-transfer-fee-cap.body=La Football League ha fijado en trescientas cincuenta libras lo m\u00e1ximo que un club puede pagar en un traspaso.
era.league-1909-transfer-fee-cap-withdrawn.title=Se retira el l\u00edmite a los traspasos
era.league-1909-transfer-fee-cap-withdrawn.body=Tras un a\u00f1o de burlas a la norma, la Football League ha retirado su l\u00edmite a los precios de traspaso.
era.ifab-1909-keeper-colour.title=Los porteros vestir\u00e1n un color distinto
era.ifab-1909-keeper-colour.body=El portero deber\u00e1 vestir una camiseta escarlata o azul real, para que el \u00e1rbitro y los jugadores lo distingan del resto de su equipo.
era.press-1909-wet-ball-report.title=Un bal\u00f3n pesado en d\u00eda de lluvia
era.press-1909-wet-ball-report.body=Un peri\u00f3dico informa de que un bal\u00f3n de cuero absorbi\u00f3 casi la mitad de su peso en agua durante noventa minutos de juego.
era.league-1910-maximum-wage-five.title=El salario m\u00e1ximo sube a cinco libras
era.league-1910-maximum-wage-five.body=La Football League ha elevado el salario m\u00e1ximo a cinco libras semanales, con primas permitidas adem\u00e1s.
era.ifab-1912-keeper-penalty-area.title=El portero solo usa las manos en el \u00e1rea
era.ifab-1912-keeper-penalty-area.body=El portero solo podr\u00e1 tocar el bal\u00f3n con las manos dentro de su propia \u00e1rea de castigo. Fuera de ella es un jugador como los dem\u00e1s.
era.league-1915-war-suspension.title=Se suspende el f\u00fatbol de Liga
era.league-1915-war-suspension.body=A causa de la guerra, la Football League no jugar\u00e1 m\u00e1s partidos hasta que vuelva la paz.
era.league-1919-resumption.title=La Liga se reanuda con veintid\u00f3s clubes
era.league-1919-resumption.body=El f\u00fatbol de Liga vuelve tras la guerra, con veintid\u00f3s clubes en cada divisi\u00f3n.
era.ifab-1920-no-offside-throw-in.title=Sin fuera de juego en el saque de banda
era.ifab-1920-no-offside-throw-in.body=Un jugador no puede estar en fuera de juego directamente de un saque de banda.
era.league-1920-third-division.title=Se forma una Tercera Divisi\u00f3n
era.league-1920-third-division.body=Los clubes de la Southern League se unen a la Football League como Tercera Divisi\u00f3n.
era.league-1920-maximum-wage-nine.title=El salario m\u00e1ximo sube a nueve libras
era.league-1920-maximum-wage-nine.body=La Football League ha elevado el salario m\u00e1ximo a nueve libras semanales.
era.league-1922-maximum-wage-eight.title=El salario m\u00e1ximo baja a ocho libras
era.league-1922-maximum-wage-eight.body=La Football League ha reducido el salario m\u00e1ximo a ocho libras semanales durante la temporada. En verano el l\u00edmite es de seis libras.
era.ifab-1924-goal-from-corner.title=Se podr\u00e1 marcar gol de c\u00f3rner
era.ifab-1924-goal-from-corner.body=Se podr\u00e1 marcar un gol directamente de un saque de esquina.
era.ifab-1925-offside-two.title=Cambia la ley del fuera de juego
era.ifab-1925-offside-two.body=Un jugador estar\u00e1 en juego si dos adversarios, en lugar de tres, est\u00e1n m\u00e1s cerca de su l\u00ednea de meta cuando se juega el bal\u00f3n.
era.press-1925-dassler-studs.title=Botas con tacos recambiables
era.press-1925-dassler-studs.body=Los hermanos Dassler fabrican botas con seis o siete tacos clavados que pueden cambiarse cuando se gastan.
era.ifab-1931-keeper-four-steps.title=El portero podr\u00e1 dar cuatro pasos
era.ifab-1931-keeper-four-steps.body=El portero podr\u00e1 dar cuatro pasos con el bal\u00f3n en las manos antes de soltarlo.
era.press-1931-laceless-ball.title=Un bal\u00f3n sin cordones
era.press-1931-laceless-ball.body=En Argentina se ha patentado un bal\u00f3n sin cordones y con v\u00e1lvula. Los clubes ingleses a\u00fan no muestran inter\u00e9s.
era.ifab-1937-ball-weight.title=Se permite un bal\u00f3n m\u00e1s pesado
era.ifab-1937-ball-weight.body=La Junta ha resuelto que el bal\u00f3n pese entre 14 y 16 onzas al comenzar el juego. Se eliminan de las leyes las especificaciones de los tacos.
era.ifab-1938-laws-rewritten.title=Se reescriben las Leyes
era.ifab-1938-laws-rewritten.body=El se\u00f1or Stanley Rous ha reescrito las Leyes del Juego en diecisiete leyes, con una redacci\u00f3n m\u00e1s clara y sin cambios de fondo.
era.league-1939-numbered-shirts.title=Las camisetas numeradas son obligatorias
era.league-1939-numbered-shirts.body=Todos los clubes de la Liga deben numerar las camisetas de sus jugadores, para que el p\u00fablico sepa qui\u00e9n es qui\u00e9n.
